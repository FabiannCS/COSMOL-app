services:
  # ----------------------------------------------------------------------------
  # Backend API (FastAPI)
  # ----------------------------------------------------------------------------
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cosmol-backend-api
    restart: unless-stopped
    ports:
      # Expuesto en 8000 para que el proxy Caddy (host.docker.internal:8000) pueda enrutar trafico en Linux Docker
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db-postgres:
        condition: service_healthy
      cache-redis:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # Base de Datos Relacional (PostgreSQL 16)
  # ----------------------------------------------------------------------------
  db-postgres:
    image: postgres:16-alpine
    container_name: cosmol-db-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5435:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cosmol_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cosmol_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-cosmol_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cosmol_user} -d ${POSTGRES_DB:-cosmol_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Memoria y Caché (Redis 7)
  # ----------------------------------------------------------------------------
  cache-redis:
    image: redis:7-alpine
    container_name: cosmol-cache-redis
    restart: unless-stopped
    # Puertos no expuestos al host: la comunicación es 100% interna vía red Docker (cache-redis:6379)
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------------------
  # Almacenamiento de Objetos / PDFs (MinIO S3)
  # ----------------------------------------------------------------------------
  storage-minio:
    image: quay.io/minio/minio:latest
    container_name: cosmol-storage-minio
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cosmol_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-cosmol_minio_secret_pass}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # ----------------------------------------------------------------------------
  # Gateway / Reverse Proxy (Caddy v2) [OPCIONAL / ETAPA FINAL]
  # Descomentar únicamente si este proyecto se despliega aislado con su propio proxy.
  # Si convive con Cosmol-Chatbot, se utiliza el Caddy central de ese repositorio.
  # ----------------------------------------------------------------------------
  # gateway-caddy:
  #   image: caddy:2-alpine
  #   container_name: cosmol-gateway-caddy
  #   restart: unless-stopped
  #   ports:
  #     - "${CADDY_HTTP_PORT:-90}:80"
  #     - "${CADDY_ALT_PORT:-91}:91"
  #   volumes:
  #     - ./caddy/Caddyfile.snippet:/etc/caddy/Caddyfile:ro
  #   environment:
  #     - APP_DOMAIN=${APP_DOMAIN:-localhost}
  #   depends_on:
  #     - backend-api

volumes:
  postgres_data:
    name: cosmol_app_postgres_data
  redis_data:
    name: cosmol_app_redis_data
  minio_data:
    name: cosmol_app_minio_data
